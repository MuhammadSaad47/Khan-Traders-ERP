<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Trader POS</title>
  <style>
    :root {
      --color-primary: #0F172A;
      --color-accent: #0EA5E9;
      --color-accent-glow: rgba(14, 165, 233, 0.4);
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--color-primary);
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .logo-container {
      margin-bottom: 24px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }
    
    .title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #64748B;
      margin-bottom: 40px;
      font-weight: 600;
    }

    .status {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 12px;
      height: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    
    .progress-bar {
      width: 300px;
      height: 4px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284C7, #38BDF8);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg width="140" height="140" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradK" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F1F5F9"/>
          <stop offset="50%" stop-color="#94A3B8"/>
          <stop offset="100%" stop-color="#475569"/>
        </linearGradient>
        <linearGradient id="gradT" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7DD3FC"/>
          <stop offset="50%" stop-color="#0284C7"/>
          <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="gradSwoosh" x1="0" y1="0" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#1E3A8A"/>
          <stop offset="50%" stop-color="#0284C7"/>
          <stop offset="100%" stop-color="#0EA5E9"/>
        </linearGradient>
        <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3" flood-color="#000"/>
        </filter>
      </defs>
      
      <g filter="url(#innerShadow)" transform="translate(15, 10) skewX(-12)">
        <path d="M -5 10 C -25 45 5 95 70 80 C 40 90 -10 65 0 10 Z" fill="url(#gradSwoosh)"/>
        <path d="M 15 0 C -5 20 -10 40 -5 50 C -5 30 5 15 25 5 Z" fill="#1E3A8A" opacity="0.8"/>
        
        <polygon points="12,15 28,15 28,75 12,75" fill="url(#gradK)"/>
        <polygon points="28,45 58,15 76,15 42,45" fill="url(#gradK)"/>
        <polygon points="38,45 66,75 84,75 50,45" fill="url(#gradK)"/>
        
        <polygon points="52,15 100,15 100,30 68,30" fill="url(#gradT)"/>
        <polygon points="76,30 76,75 60,75 60,30" fill="url(#gradT)"/>
      </g>
    </svg>
  </div>
  
  <div class="title">Khan Traders</div>
  <div class="subtitle">Enterprise Management</div>
  
  <div class="status" id="status-text">Initializing core systems...</div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <script>
    window.splashAPI.onProgress((event, { message, percent }) => {
      document.getElementById('status-text').innerText = message;
      document.getElementById('progress-fill').style.width = percent + '%';
    });
  </script>
</body>
</html>
